<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Setlist.FM Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <a class="wordmark" href="/">Setlist to Spotify</a>
</header>

<main>
    <h1>{{ main_message }}</h1>
    {% if should_show_error %}
        <p class="lede">{{ error_description }}</p>
    {% endif %}

    <p class="label">Convert more setlists. Enter the setlist.fm URL</p>
    <form method="post" onsubmit="startSpinner()">
        <input placeholder="setlist.fm URL" type="text" id="setlist_id" name="setlist_id" required>
        <button type="submit" id="submit-button">
            <span id="spinner" class="hidden"></span>Convert
        </button>
    </form>
</main>

</body>

<script>
    var newURL = location.href.split("?")[0];
    window.history.pushState('object', document.title, newURL);

    function startSpinner() {
        const spinner = document.getElementById("spinner");
        document.getElementById('submit-button').disabled = true

        spinner.classList.remove("hidden");
    }
</script>

</html>
